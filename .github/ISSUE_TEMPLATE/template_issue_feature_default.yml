name: Feature Request
description: Suggest a feature which you'd like to see implemented.
title: "[Feature] "
type: feature
body:
  - type: textarea
    id: feature_description
    attributes:
      label: Describe the feature
      description: A clear and concise description of what the requested feature is.
      placeholder: What feature do you want?
      value: "Give me feature!"
    validations:
      required: true
  - type: textarea
    id: feature_implementation
    attributes:
      label: (Optional) A step-by-step explanation on how you'd implement the feature.
      description: Please add steps to help us implement the feature.
      placeholder: |
        1. Step 1
        1. Step 2
        1. Step 3
        1. Step 4
    validations:
      required: false
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: If applicable, add screenshots to help explain your feature request.
    validations:
      required: false
  - type: textarea
    id: feature_additional_info
    attributes:
      label: Additional context
      description: Add any other context about the feature request here (e.g., existing implementations or publications).
      placeholder: Important additional info
    validations:
      required: false